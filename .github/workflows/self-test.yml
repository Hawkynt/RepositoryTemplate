name: Self-test

# The other workflows in this repo carry a `github.repository != 'Hawkynt/RepositoryTemplate'` guard
# so they no-op inside the template itself. This one deliberately does NOT: it is the only thing that
# exercises the shared tooling before `v1` moves, and `v1` ships instantly to every consuming repo.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  package-readme:
    name: package-readme (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Covers the pure logic (anchors, doc-comment flattening, marker splicing, the linter) and
      # then builds scripts/fixtures/Fixture.Package and compares the generated API reference against
      # the checked-in golden file. A change in what the generator emits fails here first.
      - name: package-readme self-test
        run: dotnet run scripts/package-readme.cs -- --self-test

  props:
    name: Directory.Build.props is valid XML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A malformed comment here breaks `dotnet build` in every repo generated from this template,
      # and nothing else in the pipeline would notice.
      - name: Parse the props file
        run: python3 -c "import xml.dom.minidom, sys; xml.dom.minidom.parse('Directory.Build.props'); print('valid')"

  scripts:
    name: Helper scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check the Node helpers
        run: |
          for f in scripts/*.mjs; do
            node --check "$f"
          done

      - name: version.pl reports a version for this repo
        run: perl scripts/version.pl --build
