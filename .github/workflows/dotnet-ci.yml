name: .NET CI

# The shared CI gate. Every generated repo calls this instead of carrying its own copy:
#
#     jobs:
#       ci:
#         uses: Hawkynt/RepositoryTemplate/.github/workflows/dotnet-ci.yml@v1
#         with:
#           solution: MyThing.sln
#
# It runs ONLY from a pull request in the calling repo. Nothing runs on a push to the default
# branch any more: a pull request must be green to merge, so re-running the same matrix on the
# merge commit proves nothing and costs a machine. Nightlies build from main after the merge.
#
# A repo with something exotic — a filesystem driver, a GTK autopilot, an AOT publish — keeps that
# job in its own ci.yml and calls this for the standard part. "Most of it", not all of it.

on:
  workflow_call:
    inputs:
      solution:
        description: 'Solution or project to restore, build and test. The one required input.'
        required: true
        type: string
      dotnet-version:
        description: 'SDK channel(s) for setup-dotnet. Multi-line for several.'
        required: false
        type: string
        default: '8.x'
      runs-on:
        description: 'Runner for the single-OS case. Ignored when os-matrix is set.'
        required: false
        type: string
        default: 'windows-latest'
      os-matrix:
        description: 'JSON array of runners, e.g. ''["ubuntu-latest","windows-latest"]''. Empty means the single runner above.'
        required: false
        type: string
        default: ''
      build-args:
        description: 'Extra arguments for restore and build, e.g. -p:DisableILRepack=true.'
        required: false
        type: string
        default: ''
      test-target:
        description: 'What to test. Defaults to the solution.'
        required: false
        type: string
        default: ''
      test-args:
        description: 'Extra arguments for dotnet test, typically a --filter.'
        required: false
        type: string
        default: ''
      advisory-test-args:
        description: >-
          A second `dotnet test` whose failure does NOT fail the build — a wall-clock performance
          tier, typically. Empty runs no second leg. Advisory means advisory: a slow shared runner
          must not turn a timing assertion into a red pull request.
        required: false
        type: string
        default: ''
      working-directory:
        description: 'Directory the dotnet commands run in. For a repo checked out beside a sibling.'
        required: false
        type: string
        default: '.'
      checkout-path:
        description: 'Where to check this repo out. Set it only when a sibling has to sit next to it.'
        required: false
        type: string
        default: ''
      siblings:
        description: >-
          JSON array of sibling repositories a cross-workspace ProjectReference needs, e.g.
          '[{"repository":"Hawkynt/C--FrameworkExtensions","path":"C--FrameworkExtensions"}]'.
        required: false
        type: string
        default: '[]'
      clone-siblings:
        description: >-
          JSON array of siblings to git-clone, e.g.
          '[{"repository":"Hawkynt/CompressionWorkbench","path":"../CompressionWorkbench"}]'.
          Use this rather than `siblings` when the csproj expects the sibling BESIDE the workspace:
          actions/checkout cannot place anything outside it, and a path like ../Foo is exactly what
          a `..\..\Foo\Bar.csproj` ProjectReference resolves to.
        required: false
        type: string
        default: '[]'
      stamp-version:
        description: 'Stamp each package version from files before building.'
        required: false
        type: boolean
        default: true
      package-readme:
        description: 'Check the package READMEs and their generated API reference against the assemblies.'
        required: false
        type: boolean
        default: true
      package-readme-os:
        description: >-
          Which runner performs that check when os-matrix is set. Exactly one must, or the
          reference would depend on which runner produced it. Empty means the first in the matrix.
        required: false
        type: string
        default: ''
      package-readme-root:
        description: 'Root the check scans. Defaults to working-directory, which is what a sibling layout needs.'
        required: false
        type: string
        default: ''
      repo-readme:
        description: >-
          Check the repository-root README against the house convention (see repo-readme/README.md).
          Off by default: the convention arrived after the repositories did, so switching it on is a
          per-repo decision taken together with the pull request that makes that README conform.
        required: false
        type: boolean
        default: false
      repo-readme-gui:
        description: >-
          The repository ships a user interface, which makes the hero image under the pitch and the
          "## 🖼️ Screenshots" section required.
        required: false
        type: boolean
        default: false
      repo-readme-root:
        description: 'Root holding the README. Defaults to working-directory, like package-readme-root.'
        required: false
        type: string
        default: ''
      repo-readme-allow:
        description: >-
          Newline-separated rules to waive, each `rule` or `rule:argument`. Every waiver is echoed
          into the job summary. There is deliberately no repo-readme-os: package-readme needs one
          because its generated output differs per runner, and a text lint does not.
        required: false
        type: string
        default: ''
      coverage:
        description: 'Run the separate coverage leg.'
        required: false
        type: boolean
        default: true
      coverage-target:
        description: 'What to measure coverage on. Defaults to test-target, then the solution.'
        required: false
        type: string
        default: ''
      timeout-minutes:
        description: >-
          Cap for each test job. Without one a job inherits GitHub's six-hour default, so anything
          wedged — a hung mount, a deadlocked pump, a UI waiting on a window that never opens —
          holds a runner for six hours and queues every other job behind it. Size it at roughly
          twice the observed successful run, not at what feels safe.
        required: false
        type: number
        default: 60
      coverage-timeout-minutes:
        description: >-
          Cap for the coverage job, which is normally several times the test job because
          instrumentation is. If this number has to be large, that is the signal to set
          `coverage: false` here and measure on a schedule instead: coverage is a reporting metric,
          and one that cannot finish before the next push supersedes it reports nothing while
          blocking everything.
        required: false
        type: number
        default: 120
      setup-command:
        description: >-
          A shell command run before restore, for system packages the tests need — a codec, a
          rendering stack, a conformance oracle. Empty runs nothing.

          This is the tier those belong in. `dotnet-smoke.yml` has the same input and says so
          itself: anything only the slow categories require belongs in the pull-request job. Until
          now that job had no way to install anything, so a third-party oracle the tests shell out
          to was simply absent from the runner, and every test needing it reported `Skipped` —
          green, and proving nothing. PNGCrushCS carried 166 `[VerifiedBy(FFmpeg)]` claims that no
          CI run has ever checked. Install the tool here and the claim is actually gated.

          It runs on every runner in `os-matrix`, so guard by platform yourself when the matrix is
          mixed: `if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y ffmpeg; fi`. The step
          uses bash, which the Windows runners have too.

          Keep it to what the gate genuinely needs. This job already costs a full matrix, and a
          package that takes minutes to install and gates nothing is latency on every pull request.
        required: false
        type: string
        default: ''

# A newer run for the same pull request supersedes the older one. Three pushes in a row used to
# queue three full matrices and run all of them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: test${{ inputs.os-matrix != '' && format(' {0}', matrix.os) || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-matrix != '' && inputs.os-matrix || format('["{0}"]', inputs.runs-on)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ inputs.checkout-path }}
          fetch-depth: 0                          # the version scripts count commits

      # A cross-workspace ProjectReference resolves only when the sibling sits where the csproj
      # expects it. Shallow: nothing here needs its history.
      - name: Check out siblings
        if: ${{ inputs.siblings != '[]' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ fromJSON(inputs.siblings)[0].repository }}
          path: ${{ fromJSON(inputs.siblings)[0].path }}
          fetch-depth: 1


      # Outside the workspace, so actions/checkout cannot do it. Shallow: nothing here needs history.
      - name: Clone siblings
        if: ${{ inputs.clone-siblings != '[]' }}
        shell: bash
        env:
          CLONE_SIBLINGS: ${{ inputs.clone-siblings }}
        run: |
          # tr -d '\r': jq on the Windows runner ends its lines CRLF, and the carriage return
          # became part of the path — "could not create work tree dir '.../CompressionWorkbench?'".
          echo "$CLONE_SIBLINGS" | jq -r '.[] | "\(.repository)\t\(.path)"' | tr -d '\r' |
          while IFS=$'\t' read -r repository path; do
            [ -n "$repository" ] || continue
            echo "cloning $repository -> $path"
            git clone --depth 1 "https://github.com/$repository.git" "$GITHUB_WORKSPACE/$path"
          done

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Stamp versions
        if: ${{ inputs.stamp-version }}
        uses: Hawkynt/RepositoryTemplate/stamp-version@v1
        with:
          mode: stamp
          path: ${{ inputs.working-directory }}

      - name: Setup
        if: ${{ inputs.setup-command != '' }}
        shell: bash
        run: ${{ inputs.setup-command }}

      - name: Restore
        working-directory: ${{ inputs.working-directory }}
        run: dotnet restore ${{ inputs.solution }} ${{ inputs.build-args }}

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: dotnet build ${{ inputs.solution }} --configuration Release --no-restore ${{ inputs.build-args }}

      - name: Test
        working-directory: ${{ inputs.working-directory }}
        run: >
          dotnet test ${{ inputs.test-target != '' && inputs.test-target || inputs.solution }}
          --configuration Release --no-build ${{ inputs.build-args }} ${{ inputs.test-args }}
          --logger "trx;LogFileName=tests.trx"

      # Advisory: a slow shared runner must not turn a timing assertion into a red pull request.
      - name: Test (advisory)
        if: ${{ !cancelled() && inputs.advisory-test-args != '' }}
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: >
          dotnet test ${{ inputs.test-target != '' && inputs.test-target || inputs.solution }}
          --configuration Release --no-build ${{ inputs.build-args }} ${{ inputs.advisory-test-args }}
          --logger "trx;LogFileName=advisory-tests.trx"

      # AFTER the tests, and it runs even when they fail. Ordered the other way it masks them
      # completely: a stale README made this step red, the job stopped, no test ever ran, and the
      # suite looked merely blocked — which is how 25 failing tests reached CompressionWorkbench's
      # main. The tests are the primary signal and must always produce one.
      - name: Check package READMEs
        if: ${{ !cancelled() && inputs.package-readme && (inputs.os-matrix == '' || matrix.os == (inputs.package-readme-os != '' && inputs.package-readme-os || fromJSON(inputs.os-matrix)[0])) }}
        uses: Hawkynt/RepositoryTemplate/package-readme@v1
        with:
          root: ${{ inputs.package-readme-root != '' && inputs.package-readme-root || inputs.working-directory }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results${{ inputs.os-matrix != '' && format('-{0}', matrix.os) || '' }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  # A job of its own, unlike the package-README check above, because this one reads nothing but text:
  # no build, no SDK, no matrix, no history. Running it BESIDE the tests rather than inside them means
  # it cannot mask them — which is the failure the comment on that step describes — and it gets its
  # own check name for about twenty seconds of runner.
  repo-readme:
    if: ${{ inputs.repo-readme }}
    name: repo README
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ inputs.checkout-path }}

      - uses: Hawkynt/RepositoryTemplate/repo-readme@v1
        with:
          root: ${{ inputs.repo-readme-root != '' && inputs.repo-readme-root || inputs.working-directory }}
          gui: ${{ inputs.repo-readme-gui }}
          allow: ${{ inputs.repo-readme-allow }}

  coverage:
    if: ${{ inputs.coverage }}
    runs-on: ${{ inputs.os-matrix != '' && fromJSON(inputs.os-matrix)[0] || inputs.runs-on }}
    timeout-minutes: ${{ inputs.coverage-timeout-minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ inputs.checkout-path }}
          fetch-depth: 0

      - name: Check out siblings
        if: ${{ inputs.siblings != '[]' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ fromJSON(inputs.siblings)[0].repository }}
          path: ${{ fromJSON(inputs.siblings)[0].path }}
          fetch-depth: 1


      # Outside the workspace, so actions/checkout cannot do it. Shallow: nothing here needs history.
      - name: Clone siblings
        if: ${{ inputs.clone-siblings != '[]' }}
        shell: bash
        env:
          CLONE_SIBLINGS: ${{ inputs.clone-siblings }}
        run: |
          # tr -d '\r': jq on the Windows runner ends its lines CRLF, and the carriage return
          # became part of the path — "could not create work tree dir '.../CompressionWorkbench?'".
          echo "$CLONE_SIBLINGS" | jq -r '.[] | "\(.repository)\t\(.path)"' | tr -d '\r' |
          while IFS=$'\t' read -r repository path; do
            [ -n "$repository" ] || continue
            echo "cloning $repository -> $path"
            git clone --depth 1 "https://github.com/$repository.git" "$GITHUB_WORKSPACE/$path"
          done

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Stamp versions
        if: ${{ inputs.stamp-version }}
        uses: Hawkynt/RepositoryTemplate/stamp-version@v1
        with:
          mode: stamp
          path: ${{ inputs.working-directory }}

      - name: Setup
        if: ${{ inputs.setup-command != '' }}
        shell: bash
        run: ${{ inputs.setup-command }}

      - name: Test with coverage
        working-directory: ${{ inputs.working-directory }}
        run: >
          dotnet test ${{ inputs.coverage-target != '' && inputs.coverage-target || (inputs.test-target != '' && inputs.test-target || inputs.solution) }}
          --configuration Release ${{ inputs.build-args }} ${{ inputs.test-args }}
          --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Generate coverage report
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:./coverage/**/coverage.cobertura.xml -targetdir:./coverage/report -reporttypes:HtmlInline_AzurePipelines

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ${{ inputs.working-directory }}/coverage/report
          if-no-files-found: ignore
