name: 'Publish a generated file through a pull request'
description: >-
  Commit one generated file onto a long-lived branch with a GitHub-signed commit and keep exactly one
  pull request open for it. For a default branch under a ruleset, where a job cannot push and a
  git-made commit would fail the signature rule.

inputs:
  file:
    description: 'Repository-relative path of the generated file. It must already be written.'
    required: true
  branch:
    description: 'The long-lived branch that carries it. Force-updated by every run.'
    required: true
  message:
    description: 'Commit message. House style: start it with + - * # or !'
    required: true
  title:
    description: 'Pull request title, used only when there is no open one for the branch.'
    required: true
  body:
    description: 'Pull request body, used only when there is no open one for the branch.'
    required: true
  volatile:
    description: >-
      Extended regex for lines that change every run without meaning anything — a run id, a
      timestamp, a machine name. They are ignored when deciding whether the file CHANGED, and still
      written when something else did. Without this, a generator that stamps its own run id publishes
      on every run: pull request, merge, push, CI, generate, publish, forever. If your generator
      stamps provenance, this input is not optional in spirit.
    required: false
    default: ''
  token:
    description: >-
      The token to act with. Nothing done with GITHUB_TOKEN can trigger another workflow, so a pull
      request opened with it arrives with NO CHECKS and can never satisfy a required-status-checks
      rule. Pass a personal access token with contents and pull-requests write where the repository
      requires checks; the default still opens a mergeable pull request, it just has none.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # A commit made by git on the runner is unsigned. The contents API signs it, which is the only
    # reason this is an API call and not three lines of git.
    - name: Publish it through a pull request
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        FILE: ${{ inputs.file }}
        BRANCH: ${{ inputs.branch }}
        MESSAGE: ${{ inputs.message }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
        VOLATILE: ${{ inputs.volatile }}
      run: bash "${{ github.action_path }}/../scripts/publish-generated-file.sh"
